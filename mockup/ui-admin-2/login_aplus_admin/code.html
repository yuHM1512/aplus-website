<style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #E5EEFF 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-glow {
            box-shadow: 0 0 40px 0 rgba(0, 110, 245, 0.05);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 110, 245, 0.2);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-[420px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="bg-surface-container-lowest rounded-xl shadow-lg border border-border-gray p-10 glass-glow">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="mb-4">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[40px]" data-icon="water_drop" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">APLUS Tech</h1>
<p class="text-label-md font-label-md text-on-surface-variant mt-1">Admin Portal</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="loginForm" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-border-gray rounded-lg text-body-md font-body-md text-on-surface focus:border-ocean-blue transition-all" id="email" name="email" placeholder="admin@aplustechnologies.vn" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-border-gray rounded-lg text-body-md font-body-md text-on-surface focus:border-ocean-blue transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-ocean-blue transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 text-ocean-blue border-border-gray rounded focus:ring-ocean-blue cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 text-body-sm font-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">
                        Ghi nhớ đăng nhập
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-ocean-blue hover:bg-primary-container text-white py-3.5 rounded-lg font-label-md text-label-md transition-all duration-200 active:scale-[0.98] shadow-sm flex items-center justify-center gap-2" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Footer -->
<footer class="mt-8 text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant/60">
                © 2026 APLUS Technologies
            </p>
</footer>
</main>
<!-- Micro-interactions Script -->
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function() {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the icon
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            
            // Add a subtle click animation
            this.classList.add('scale-90');
            setTimeout(() => this.classList.remove('scale-90'), 100);
        });

        // Simple login form animation on submit
        const form = document.querySelector('#loginForm');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Đang xử lý...';
            
            // Simulation of login delay
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = 'Đăng nhập <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>';
            }, 1500);
        });

        // Hover effect for input containers
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-ocean-blue/5');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-ocean-blue/5');
            });
        });
    </script>
</body></html>
